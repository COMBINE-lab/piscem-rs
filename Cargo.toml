[workspace]
members = [".", "crates/py-piscem", "crates/seq_geom_parser", "crates/thread-broker"]
exclude = ["sshash-rs", "scripts/hb-vs-phast"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
version = "0.5.0"
authors = ["piscem-rs Contributors"]
license-file = "LICENSE"
repository = "https://github.com/COMBINE-lab/piscem-rs"

[workspace.dependencies]
sshash-lib = { version = "0.8.0" }
tiny-dict = { version = "0.8.0" }
sux = { version = "0.15.2", features = ["epserde"] }
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.11"
memmap2 = "0.9"
tempfile = "3.15"
seq-macro = "0.3"
cpu-time = "1.0.0"

[package]
name = "piscem-rs"
version = "0.12.0"
edition = "2024"
rust-version = "1.91"
license = "BSD-3-Clause"
description = "Rust implementation of piscem with semantic parity harness"
repository = "https://github.com/COMBINE-lab/piscem-rs"
homepage = "https://github.com/COMBINE-lab/piscem-rs"
documentation = "https://docs.rs/piscem-rs"

# Keep the published crate small — exclude large local-only dirs.
exclude = [
  "test_data/",
  "piscem-cpp/",
  "piscem/",
  "crates/",
  "sshash-rs/",
  "sshash_tmp/",
  "*.json",
  "*.json.gz",
  "*.time",
  "publish.sh",
  "release-py.sh",
]

[features]
default = ["mimalloc"]
parity-test = ["dep:libradicl"]
# Parallel gzip decoding via the pure-Rust COMBINE-lab/rapidgzip-rust.
# No C++ toolchain required. See RESULTS.md.
rapidgzip = ["dep:rapidgzip-core", "rapidgzip-core/busy-time-accounting"]
rapidgzip-cpu-accounting = ["rapidgzip", "rapidgzip-core/cpu-accounting"]
# Compatibility alias retained for the local sampled-versus-exact validation
# harness. Exact event-time accounting is part of the normal `rapidgzip`
# integration because it is the production broker signal.
rapidgzip-busy-time-accounting = ["rapidgzip"]

[dependencies]
seq_geom_parser = { version = "1.1.0", path = "crates/seq_geom_parser" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sshash-lib = "0.8.0"
tiny-dict = "0.8.0"
# Total physical memory, portably. Paired with getrlimit and cgroup reads in
# `index::mem_budget`, which cover the limits `sysinfo` cannot see.
# Held at 0.36: `sux` -> `dsi-progress-logger` pins `sysinfo = "0.36.1"`, which
# can never unify with 0.39, so bumping puts two copies of the crate in the
# build tree. Nothing we call needs anything newer.
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
# getrlimit(RLIMIT_AS): the one memory ceiling visible on both Linux and macOS.
libc = "0.2"

# Fast hashing with deterministic seeding (same version as sshash-rs)
ahash = "0.8"

# Data-parallel index-build steps (parsing tilings); already in the tree via
# sshash-lib.
rayon = "1.11"

# `HashTable`: a raw table keyed by hash with caller-supplied equality, which
# `std` cannot express (`raw_entry` is still unstable). Used by
# `index::eq_classes` to intern EC labels by id rather than storing a second
# owned copy of every label as the map key. Same version tiny-dict resolves,
# so the two share one copy.
hashbrown = "0.17"

# Phase 4 dependencies
dashmap = "6"
smallvec = "1.13"
crossbeam = "0.8"
# TEMPORARY: `paraseq-temp` 0.6.2-pre.1 is upstream paraseq 0.6.1 plus the
# worker-pool admission fix offered upstream as noamteyssier/paraseq#100: a
# worker could be counted live after a shrink had already been acknowledged,
# briefly running past the thread budget (the `paraseq_resize_safety` flake).
# Its library is still named `paraseq`, so code is unchanged; switch back to
# `paraseq = { version = "0.6", default-features = false }` once a paraseq
# release includes #100. `ThreadPool` (paraseq's resizable worker pool, from
# noamteyssier/paraseq#78) is what lets the mapping thread count change
# mid-run, so a bad decode/map split can be corrected rather than merely
# avoided.
#
# Default features are off on purpose: piscem opens and decompresses its own
# inputs (niffler below, or rapidgzip) and hands paraseq plain readers, so it
# needs none of paraseq's optional features. paraseq's defaults would also turn
# on `niffler/default`, and with it niffler >= 3.0.1's `lzma` feature, which
# links liblzma 0.4 -- unresolvable next to sshash-lib's needletail 0.7, which
# links liblzma 0.3 (only one crate may link the native `lzma`).
paraseq = { package = "paraseq-temp", version = "=0.6.2-pre.1", default-features = false }
# niffler with its *default* features: exactly the set piscem has always been
# built with, since paraseq-temp's defaults enabled `niffler/default` and
# features unify. The old `default-features = false` list here was inert, and
# is wrong on its own: niffler 3.0.0's `bz2` does not enable a bzip2 backend
# (only `bzip2/default` does, via niffler's defaults), so it fails to compile
# once paraseq stops supplying them. Defaults also keep .xz input working.
# While needletail (via sshash-lib) links liblzma 0.3 this resolves to niffler
# 3.0.0, since 3.0.1's `lzma` moved to liblzma 0.4.
niffler = "3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
indicatif = "0.18"

# Succinct data structures (same versions as sshash-rs)
sux = { version = "0.15.2", features = ["epserde"] }
epserde = "0.13.2"
value-traits = "0.3"
mem_dbg = "0.4.1"

# RAD file parsing — optional, enabled by parity-test feature
libradicl = { version = "0.21", optional = true }
mimalloc = { version = "0.1.48", optional = true }
# `DecoderPool` gives one aggregate decode budget across files with a mutable
# ceiling, and marker admission is decoupled from the runtime throttle, so a low
# limit no longer latches `DecoderPath::Sequential`. `busy-time-accounting`
# supplies the exact cumulative executing-region integral the thread broker
# solves the decode/map split from; reconstructing it by sampling was measured
# 17-313% off. Released in 0.3.0, so this is no longer a git dependency.
# 0.3.1 minimum: 0.3.0's shared pool had a lost-wakeup in its release path
# that could deadlock every attached decoder once a broker shrank the pool
# enough to keep admission on the contended slow path. See CHANGELOG 0.9.1.
rapidgzip-core = { version = "0.3.1", optional = true }

thread-broker = { version = "0.1.0", path = "crates/thread-broker" }

# Serial gzip decoding (see `io::fastx::open_serial`).
sirocco = "0.3"

[dev-dependencies]
tempfile = "3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libradicl = "0.21"

# Examples that need optional features. These files ship in the package:
# excluding declared targets breaks maturin's sdist vendoring of this crate
# (the raw manifest is copied while the files are dropped).
[[example]]
name = "atac_mismatch_diag"
required-features = ["parity-test"]

[[example]]
name = "test_atac_compare"
required-features = ["parity-test"]

[[example]]
name = "compare_rad"
required-features = ["parity-test"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
# Line tables only: no codegen impact, but without this `perf` cannot attribute
# samples to source lines and inlined frames vanish entirely under thin-LTO.
debug = 1

[profile.bench]
inherits = "release"
debug = true

[[test]]
name = "floor_check"
required-features = ["rapidgzip"]

[[test]]
name = "broker_adapters"
required-features = ["rapidgzip"]

[[test]]
name = "pool_reachable"
required-features = ["rapidgzip"]

[[test]]
name = "decode_parallelism"
required-features = ["rapidgzip"]
