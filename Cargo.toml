[workspace]
members = [".", "crates/py-piscem", "crates/seq_geom_parser"]
exclude = ["sshash-rs"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
version = "0.5.0"
authors = ["SSHash Contributors"]
license-file = "LICENSE"
repository = "https://github.com/COMBINE-lab/sshash-rs"

[workspace.dependencies]
sshash-lib = { version = "0.6.0" }
tiny-dict = { version = "0.6.0" }
sux = { version = "0.14.0", features = ["epserde"] }
ph = { package = "ph-temp", version = "0.12.0", default-features = false, features = ["rapidhash"] }
needletail = "0.6"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.11"
memmap2 = "0.9"
tempfile = "3.15"
seq-macro = "0.3"

[package]
name = "piscem-rs"
version = "0.6.1"
edition = "2024"
rust-version = "1.91"
license = "BSD-3-Clause"
description = "Rust implementation of piscem with semantic parity harness"
repository = "https://github.com/COMBINE-lab/piscem-rs"
homepage = "https://github.com/COMBINE-lab/piscem-rs"
documentation = "https://docs.rs/piscem-rs"

# Keep the published crate small — exclude large local-only dirs.
exclude = [
  "test_data/",
  "piscem-cpp/",
  "piscem/",
  "examples/",
  "tests/",
  "crates/",
  "sshash-rs/",
  "sshash_tmp/",
  "*.json",
  "*.json.gz",
  "*.time",
  "publish.sh",
  "release-py.sh",
]

[features]
default = ["mimalloc"]
parity-test = ["dep:libradicl"]

[dependencies]
seq_geom_parser = { version = "1.1.0", path = "crates/seq_geom_parser" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sshash-lib = "0.6"
tiny-dict = "0.6"

# Fast hashing with deterministic seeding (same version as sshash-rs)
ahash = "0.8"

# Phase 4 dependencies
dashmap = "6"
smallvec = "1.13"
crossbeam = "0.8"
paraseq = "0.4"
niffler = { version = "3", default-features = false, features = [
  "gz",
  "bz2",
  "zstd",
] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
indicatif = "0.18"

# Succinct data structures (same versions as sshash-rs)
sux = { version = "0.14.0", features = ["epserde"] }
epserde = "0.12.5"
value-traits = "0.2"
mem_dbg = "0.4.1"

# RAD file parsing — optional, enabled by parity-test feature
libradicl = { version = "0.12", optional = true }
mimalloc = { version = "0.1.48", optional = true }

[dev-dependencies]
tempfile = "3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libradicl = "0.12"

# Examples that need optional features (excluded from publish but needed locally).
[[example]]
name = "atac_mismatch_diag"
required-features = ["parity-test"]

[[example]]
name = "test_atac_compare"
required-features = ["parity-test"]

[[example]]
name = "compare_rad"
required-features = ["parity-test"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.bench]
inherits = "release"
debug = true

[patch.crates-io]
# Uncomment to use local sshash-rs checkout for development:
# sshash-lib = { path = "sshash-rs/crates/sshash-lib" }
# tiny-dict = { path = "sshash-rs/crates/tiny-dict" }
