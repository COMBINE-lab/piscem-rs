[workspace]
members = [".", "crates/py-piscem", "crates/seq_geom_parser", "crates/thread-broker"]
exclude = ["sshash-rs"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
version = "0.5.0"
authors = ["SSHash Contributors"]
license-file = "LICENSE"
repository = "https://github.com/COMBINE-lab/sshash-rs"

[workspace.dependencies]
sshash-lib = { version = "0.6.3" }
tiny-dict = { version = "0.6.3" }
sux = { version = "0.14.0", features = ["epserde"] }
ph = { package = "ph-temp", version = "0.12.0", default-features = false, features = ["rapidhash"] }
needletail = "0.6"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.11"
memmap2 = "0.9"
tempfile = "3.15"
seq-macro = "0.3"
cpu-time = "1.0.0"

[package]
name = "piscem-rs"
version = "0.8.0"
edition = "2024"
rust-version = "1.91"
license = "BSD-3-Clause"
description = "Rust implementation of piscem with semantic parity harness"
repository = "https://github.com/COMBINE-lab/piscem-rs"
homepage = "https://github.com/COMBINE-lab/piscem-rs"
documentation = "https://docs.rs/piscem-rs"

# Keep the published crate small — exclude large local-only dirs.
exclude = [
  "test_data/",
  "piscem-cpp/",
  "piscem/",
  "examples/",
  "tests/",
  "crates/",
  "sshash-rs/",
  "sshash_tmp/",
  "*.json",
  "*.json.gz",
  "*.time",
  "publish.sh",
  "release-py.sh",
]

[features]
default = ["mimalloc"]
parity-test = ["dep:libradicl"]
# Parallel gzip decoding via the pure-Rust COMBINE-lab/rapidgzip-rust.
# No C++ toolchain required. See RESULTS.md.
rapidgzip = ["dep:rapidgzip-core", "rapidgzip-core/busy-time-accounting"]
rapidgzip-cpu-accounting = ["rapidgzip", "rapidgzip-core/cpu-accounting"]
# Compatibility alias retained for the local sampled-versus-exact validation
# harness. Exact event-time accounting is part of the normal `rapidgzip`
# integration because it is the production broker signal.
rapidgzip-busy-time-accounting = ["rapidgzip"]

[dependencies]
seq_geom_parser = { version = "1.1.0", path = "crates/seq_geom_parser" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sshash-lib = "0.6.3"
tiny-dict = "0.6.3"
# Total physical memory, portably. Paired with getrlimit and cgroup reads in
# `index::mem_budget`, which cover the limits `sysinfo` cannot see.
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
# getrlimit(RLIMIT_AS): the one memory ceiling visible on both Linux and macOS.
libc = "0.2"

# Fast hashing with deterministic seeding (same version as sshash-rs)
ahash = "0.8"

# Phase 4 dependencies
dashmap = "6"
smallvec = "1.13"
crossbeam = "0.8"
# TEMPORARY: our fork, while the dynamic worker pool is in review.
#
# Adds `ThreadPool` so the mapping thread count can change mid-run, which is
# what lets a bad decode/map split be corrected instead of merely avoided.
# See noamteyssier/paraseq#75. Pinned to the reviewed implementation used by
# the broker audit; revert to a released crates.io version once that lands.
paraseq = { git = "https://github.com/rob-p/paraseq.git", rev = "40ae74fe4e8c6d8009ae65eb4c955083c238fa06" }
niffler = { version = "3", default-features = false, features = [
  "gz",
  "bz2",
  "zstd",
] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
indicatif = "0.18"

# Succinct data structures (same versions as sshash-rs)
sux = { version = "0.14.0", features = ["epserde"] }
epserde = "0.12.5"
value-traits = "0.2"
mem_dbg = "0.4.1"

# RAD file parsing — optional, enabled by parity-test feature
libradicl = { version = "0.16", optional = true }
mimalloc = { version = "0.1.48", optional = true }
# TEMPORARY: an exact upstream commit, while adaptive scheduling is developed.
#
# Adds `DecoderPool` (one aggregate decode budget across files, mutable ceiling)
# and decouples marker admission from the runtime throttle, so a low limit no
# longer latches `DecoderPath::Sequential`. Together with the paraseq fork this
# is what makes the decode/map split converge-able rather than predict-able.
# The shared pool, lifetime CPU accounting, and exact cumulative executing-time
# signal are merged on COMBINE-lab/rapidgzip-rust main. Pinned to the gated
# implementation used by the broker audit; revert to a released crates.io
# version once that lands.
rapidgzip-core = { git = "https://github.com/COMBINE-lab/rapidgzip-rust.git", rev = "276a41f77fb927e24cb0898a638a08b21eb048c6", optional = true }

thread-broker = { path = "crates/thread-broker" }

[dev-dependencies]
tempfile = "3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libradicl = "0.16"

# Examples that need optional features (excluded from publish but needed locally).
[[example]]
name = "atac_mismatch_diag"
required-features = ["parity-test"]

[[example]]
name = "test_atac_compare"
required-features = ["parity-test"]

[[example]]
name = "compare_rad"
required-features = ["parity-test"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
# Line tables only: no codegen impact, but without this `perf` cannot attribute
# samples to source lines and inlined frames vanish entirely under thin-LTO.
debug = 1

[profile.bench]
inherits = "release"
debug = true

[[test]]
name = "floor_check"
required-features = ["rapidgzip"]

[[test]]
name = "broker_adapters"
required-features = ["rapidgzip"]

[[test]]
name = "pool_reachable"
required-features = ["rapidgzip"]

[[test]]
name = "decode_parallelism"
required-features = ["rapidgzip"]
